name: test

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # unit tests, check-land, check-collide (and check-contact once it exists): no browser, no dependencies
      - run: node tools/check-all.mjs
